<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATP COMMAND CENTER - DIESNAT FMIPA 12</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCksEKeVfZ39valn9SGLFYySslqoFTczEI",
            authDomain: "atpdiesnatfmipa12.firebaseapp.com",
            projectId: "atpdiesnatfmipa12",
            storageBucket: "atpdiesnatfmipa12.firebasestorage.app",
            messagingSenderId: "784817488307",
            appId: "1:784817488307:web:9dae99a93e3fef8fcccbc6"
        };

        const app = initializeApp(firebaseConfig);
        const dbCloud = getFirestore(app);
        
        window.db = { ruang: [], alat: [], konstruksi: [], log: [], kategori: ['Gate In', 'Gate Out'] };
        window.dbCloud = dbCloud;

        // REALTIME LISTENER - Selalu aktif agar sinkron otomatis
        onSnapshot(doc(window.dbCloud, "atp", "data"), (docSnap) => {
            if (docSnap.exists()) {
                window.db = docSnap.data();
                if(document.getElementById('loginModal').style.display === 'none') {
                    renderSemua();
                    updateDashboard();
                }
            } else {
                window.db = { ruang: [], alat: [], konstruksi: [], log: [], kategori: ['Gate In', 'Gate Out'] };
                setDoc(doc(window.dbCloud, "atp", "data"), window.db);
            }
        });

        window.saveDB = function() {
            setDoc(doc(window.dbCloud, "atp", "data"), window.db);
            updateDashboard();
        };
    </script>
    <style>
        :root { --bg-dark: #121212; --surface: #1e1e1e; --text-main: #e0e0e0; --text-muted: #888888; --accent-green: #00e676; --accent-yellow: #ffea00; --accent-red: #ff1744; --border-color: #333333; }
        body.light-mode { --bg-dark: #f0f2f5; --surface: #ffffff; --text-main: #1a1a1a; --text-muted: #666666; --accent-green: #00a03e; --accent-yellow: #d4a000; --accent-red: #d50000; --border-color: #cccccc; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; transition: background-color 0.3s, color 0.3s; }
        
        /* Mobile Responsive Fix */
        @media (max-width: 768px) {
            body { flex-direction: column; overflow-y: auto; }
            .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border-color); }
            .main-content { padding: 1rem; }
            .grid-container { grid-template-columns: 1fr; }
        }

        #loginModal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-box { background: var(--surface); padding: 2.5rem; border-radius: 8px; width: 320px; text-align: center; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .sidebar { width: 260px; background-color: var(--surface); border-right: 1px solid var(--border-color); padding: 2rem 1.5rem; box-sizing: border-box; display: flex; flex-direction: column; transition: background-color 0.3s; }
        .logo { font-size: 1.2rem; font-weight: bold; letter-spacing: 2px; color: var(--text-main); margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; }
        .user-profile { background-color: var(--bg-dark); border: 1px solid var(--border-color); padding: 1rem; border-radius: 4px; margin-bottom: 2rem; }
        .nav-link { background: none; border: none; color: var(--text-muted); text-align: left; padding: 0; margin-bottom: 1.5rem; font-size: 0.95rem; cursor: pointer; }
        .nav-link:hover, .nav-link.active { color: var(--text-main); font-weight: bold; }
        .main-content { flex: 1; padding: 3rem; box-sizing: border-box; overflow-y: auto; }
        .tab-section { display: none; } .tab-section.active { display: block; }
        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; margin-bottom: 3rem; }
        .card { background-color: var(--surface); border: 1px solid var(--border-color); padding: 1.5rem; border-radius: 4px; }
        .form-container { background-color: var(--surface); border: 1px solid var(--border-color); padding: 1.5rem; border-radius: 4px; margin-bottom: 2rem; display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap; }
        .form-group { display: flex; flex-direction: column; flex: 1; min-width: 130px; }
        label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.5rem; }
        select, input { background-color: var(--bg-dark); color: var(--text-main); border: 1px solid var(--border-color); padding: 0.8rem; border-radius: 4px; }
        button.btn-primary { background-color: var(--text-main); color: var(--bg-dark); border: none; padding: 0.8rem 2rem; font-weight: bold; border-radius: 4px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; } th, td { padding: 1rem; border-bottom: 1px solid var(--border-color); }
        .status-badge { padding: 0.3rem 0.6rem; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
        .badge-aman { background-color: rgba(0, 230, 118, 0.1); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .badge-kritis { background-color: rgba(255, 23, 68, 0.1); color: var(--accent-red); border: 1px solid var(--accent-red); }
        .badge-pending { background-color: rgba(255, 234, 0, 0.1); color: var(--accent-yellow); border: 1px solid var(--accent-yellow); }
        .badge-abu { background-color: rgba(136, 136, 136, 0.1); color: var(--text-muted); border: 1px solid var(--text-muted); }
    </style>
</head>
<body>
    <div id="loginModal">
        <div class="login-box">
            <h2>Identitas Petugas</h2>
            <input type="text" id="loginName" style="width: 100%; margin-bottom: 1rem; padding: 0.8rem;">
            <button class="btn-primary" onclick="masukSistem()" style="width: 100%;">AKSES KOMANDO</button>
        </div>
    </div>
    <div class="sidebar">
        <div class="logo">ATP DIESNAT 12</div>
        <div class="user-profile">
            <label>PETUGAS AKTIF:</label>
            <div class="user-name" id="displayUserName">Memuat...</div>
            <button class="logout-btn" onclick="keluarSistem()">Ganti</button>
        </div>
        <button class="nav-link active" onclick="bukaTab('dashboard', this)">Dashboard Log</button>
        <button class="nav-link" onclick="bukaTab('ruang', this)">Matriks Ruang</button>
        <button class="nav-link" onclick="bukaTab('alat', this)">Sirkulasi Alat</button>
        <button class="nav-link" onclick="bukaTab('konstruksi', this)">Manajemen Konstruksi</button>
        <button class="nav-link" onclick="bukaTab('pengaturan', this)">Pengaturan</button>
    </div>
    <div class="main-content">
        <div id="dashboard" class="tab-section active">...</div>
        </div>
    <script>
        function masukSistem() { 
            const n = document.getElementById('loginName').value; 
            if(!n.trim()) return; 
            localStorage.setItem('atpUser', n); 
            location.reload(); 
        }
        window.onload = function() {
            const user = localStorage.getItem('atpUser');
            if(user) {
                document.getElementById('loginModal').style.display = 'none';
                document.getElementById('displayUserName').innerText = user;
                renderSemua(); // Panggil render karena database sudah di-listen global
            } else {
                document.getElementById('loginModal').style.display = 'flex';
            }
        };
        // ... (Fungsi render, tambah, dptClass, dll tetap sama)
    </script>
</body>
</html>
