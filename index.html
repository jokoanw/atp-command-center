<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATP COMMAND CENTER - DIESNAT FMIPA 12</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --bg-dark: #121212; --surface: #1e1e1e; --text-main: #e0e0e0; --text-muted: #888888;
            --accent-green: #00e676; --accent-yellow: #ffea00; --accent-red: #ff1744; --border-color: #333333;
        }
        body.light-mode {
            --bg-dark: #f0f2f5; --surface: #ffffff; --text-main: #1a1a1a; --text-muted: #666666;
            --accent-green: #00a03e; --accent-yellow: #d4a000; --accent-red: #d50000; --border-color: #cccccc;
        }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; transition: background-color 0.3s, color 0.3s; }

        /* Modal Login */
        #loginModal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-box { background: var(--surface); padding: 2.5rem; border-radius: 8px; width: 320px; text-align: center; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        /* Sidebar Desktop */
        .sidebar { width: 260px; background-color: var(--surface); border-right: 1px solid var(--border-color); padding: 2rem 1.5rem; box-sizing: border-box; display: flex; flex-direction: column; transition: background-color 0.3s; }
        .logo { font-size: 1.2rem; font-weight: bold; letter-spacing: 2px; color: var(--text-main); margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; }
        .user-profile { background-color: var(--bg-dark); border: 1px solid var(--border-color); padding: 1rem; border-radius: 4px; margin-bottom: 2rem; }
        .user-name { font-size: 1rem; font-weight: bold; margin-bottom: 0.5rem; color: var(--text-main); }
        .logout-btn { font-size: 0.7rem; color: var(--text-main); cursor: pointer; text-decoration: underline; background: none; border: none; padding: 0; }
        .nav-link { background: none; border: none; color: var(--text-muted); text-align: left; padding: 0; margin-bottom: 1.5rem; font-size: 0.95rem; cursor: pointer; transition: color 0.3s ease; }
        .nav-link:hover, .nav-link.active { color: var(--text-main); font-weight: bold; }
        .theme-toggle { margin-top: auto; padding: 0.8rem; background-color: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 4px; cursor: pointer; }
        .reset-btn { padding: 0.8rem; background-color: rgba(255, 23, 68, 0.1); border: 1px solid var(--accent-red); color: var(--accent-red); border-radius: 4px; cursor: pointer; margin-top: 10px; }

        /* Content */
        .main-content { flex: 1; padding: 3rem; box-sizing: border-box; overflow-y: auto; }
        .tab-section { display: none; }
        .tab-section.active { display: block; }
        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; margin-bottom: 3rem; }
        .card { background-color: var(--surface); border: 1px solid var(--border-color); padding: 1.5rem; border-radius: 4px; }
        .form-container { background-color: var(--surface); border: 1px solid var(--border-color); padding: 1.5rem; border-radius: 4px; margin-bottom: 2rem; display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap; }
        .form-group { display: flex; flex-direction: column; flex: 1; min-width: 130px; }
        input, select { background-color: var(--bg-dark); color: var(--text-main); border: 1px solid var(--border-color); padding: 0.8rem; border-radius: 4px; }
        button.btn-primary { background-color: var(--text-main); color: var(--bg-dark); border: none; padding: 0.8rem 2rem; font-weight: bold; border-radius: 4px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 1rem; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }

        .status-badge { padding: 0.3rem 0.6rem; border-radius: 20px; font-size: 0.75rem; font-weight: bold; border: none; outline: none; cursor: pointer; }
        .badge-aman { background-color: rgba(0, 230, 118, 0.1); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .badge-kritis { background-color: rgba(255, 23, 68, 0.1); color: var(--accent-red); border: 1px solid var(--accent-red); }
        .badge-pending { background-color: rgba(255, 234, 0, 0.1); color: var(--accent-yellow); border: 1px solid var(--accent-yellow); }
        .badge-abu { background-color: rgba(136, 136, 136, 0.1); color: var(--text-muted); border: 1px solid var(--text-muted); }

        /* MOBILE FIX */
        @media (max-width: 768px) {
            body { flex-direction: column; overflow: hidden; }
            .sidebar { width: 100%; height: auto; padding: 10px; flex-direction: row; flex-wrap: wrap; justify-content: space-around; border-bottom: 1px solid var(--border-color); }
            .logo, .user-profile, .theme-toggle, .reset-btn { display: none; }
            .nav-link { margin: 0; padding: 10px; font-size: 0.7rem; }
            .main-content { padding: 1rem; padding-bottom: 60px; overflow-y: auto; }
            .grid-container { grid-template-columns: 1fr; }
            table { display: block; overflow-x: auto; white-space: nowrap; }
        }
    </style>
</head>
<body>

    <div id="loginModal">
        <div class="login-box">
            <h2>Identitas Petugas</h2>
            <input type="text" id="loginName" placeholder="Masukkan Nama Anda" style="width: 100%; box-sizing:border-box; margin-bottom: 1rem; padding: 0.8rem; text-align: center;">
            <button class="btn-primary" onclick="masukSistem()" style="width: 100%;">Akses Komando</button>
        </div>
    </div>

    <div class="sidebar">
        <div class="logo">ATP DIESNAT 12</div>
        <div class="user-profile">
            <label>PETUGAS:</label>
            <div class="user-name" id="displayUserName">...</div>
            <button class="logout-btn" onclick="keluarSistem()">Ganti</button>
        </div>
        <button class="nav-link active" onclick="bukaTab('dashboard', this)">Dashboard</button>
        <button class="nav-link" onclick="bukaTab('ruang', this)">Ruang</button>
        <button class="nav-link" onclick="bukaTab('alat', this)">Alat</button>
        <button class="nav-link" onclick="bukaTab('konstruksi', this)">Konstruksi</button>
        <button class="nav-link" onclick="bukaTab('pengaturan', this)">Pengaturan</button>
        <button class="theme-toggle" onclick="toggleTheme()">🌓 Tema</button>
    </div>

    <div class="main-content">
        <div id="dashboard" class="tab-section active">
            <h1>Sentralisasi Presisi</h1>
            <div class="grid-container">
                <div class="card"><div class="card-title">Ruang (Tap-In)</div><p class="card-value" id="dashRuang">0</p><p class="card-subtext" id="dashRuangSub"></p></div>
                <div class="card"><div class="card-title">Sirkulasi Alat</div><p class="card-value" id="dashAlat">100%</p><p class="card-subtext" id="dashAlatSub"></p></div>
                <div class="card"><div class="card-title">Konstruksi</div><p class="card-value" id="dashKonstruksi">0%</p><p class="card-subtext" id="dashKonstruksiSub"></p></div>
            </div>
            <table><thead><tr><th>Waktu</th><th>Oleh</th><th>Tindakan</th><th>Modul</th></tr></thead><tbody id="tabelLog"></tbody></table>
        </div>
        
        <div id="ruang" class="tab-section">
            <h1>Matriks Ruang</h1>
            <div class="form-container"><input type="text" id="inputRuang" placeholder="Nama Ruang"><select id="divisiRuang"><option>Acara</option><option>DDD</option><option>Lapangan</option></select><button class="btn-primary" onclick="tambahRuang()">Tambah</button></div>
            <table><tbody id="tabelRuang"></tbody></table>
        </div>

        <div id="alat" class="tab-section">
            <h1>Sirkulasi Alat</h1>
            <div class="form-container"><input type="text" id="inputAlat" placeholder="Nama Alat"><input type="text" id="asalAlat" placeholder="Asal"><input type="number" id="jumlahAlat" value="1"><button class="btn-primary" onclick="tambahAlat()">Catat</button></div>
            <table><tbody id="tabelAlat"></tbody></table>
        </div>

        <div id="konstruksi" class="tab-section">
            <h1>Manajemen Konstruksi</h1>
            <div class="form-container"><input type="text" id="inputMaterial" placeholder="Material"><input type="number" id="jumlahMaterial" value="1"><select id="kategoriProyek" onchange="renderKonstruksi()"></select><button class="btn-primary" onclick="tambahMaterial()">Tambah</button></div>
            <table><tbody id="tabelKonstruksi"></tbody></table>
        </div>

        <div id="pengaturan" class="tab-section">
            <h1>Pengaturan</h1>
            <button class="reset-btn" onclick="resetDatabase()">RESET SEMUA DATA</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCksEKeVfZ39valn9SGLFYySslqoFTczEI",
            authDomain: "atpdiesnatfmipa12.firebaseapp.com",
            projectId: "atpdiesnatfmipa12",
            storageBucket: "atpdiesnatfmipa12.firebasestorage.app",
            messagingSenderId: "784817488307",
            appId: "1:784817488307:web:9dae99a93e3fef8fcccbc6"
        };
        firebase.initializeApp(firebaseConfig);
        const dbCloud = firebase.firestore();

        let db = { ruang: [], alat: [], konstruksi: [], log: [], kategori: ['Gate In', 'Gate Out'] };

        dbCloud.collection("atp").doc("data").onSnapshot((doc) => {
            if (doc.exists) { db = doc.data(); renderSemua(); updateDashboard(); renderDropdownKategori(); }
        });

        function saveDB() { dbCloud.collection("atp").doc("data").set(db); }

        function getModulColor(modul) {
            if(modul === 'Ruang') return '#dda0dd'; // Ungu Muda
            if(modul === 'Alat') return '#ff69b4';  // Pink
            if(modul === 'Konstruksi') return '#87cefa'; // Biru Muda
            return 'var(--text-muted)';
        }

        function dptClass(val) {
            val = val.toLowerCase();
            if(val.includes('sudah') || val.includes('tersedia') || val.includes('dikembalikan') || val.includes('acc')) return 'badge-aman';
            if(val.includes('sedang')) return 'badge-pending';
            if(val.includes('hilang') || val.includes('belum')) return 'badge-kritis';
            return 'badge-abu';
        }

        function renderSemua() { renderRuang(); renderAlat(); renderKonstruksi(); renderLog(); }

        function renderRuang() {
            const tbody = document.getElementById('tabelRuang'); tbody.innerHTML = '';
            if(!db.ruang) return;
            db.ruang.forEach((r, i) => {
                tbody.innerHTML += `<tr><td>${r.nama}</td><td>${r.divisi}</td>
                <td><select class="status-badge ${dptClass(r.status)}" onchange="db.ruang[${i}].status=this.value; catatLog('Ubah Ruang', 'Ruang', 'var(--accent-yellow)'); saveDB();"><option value="Belum Diajukan" ${r.status=='Belum Diajukan'?'selected':''}>Belum Diajukan</option><option value="Sudah Terajukan (ACC)" ${r.status=='Sudah Terajukan (ACC)'?'selected':''}>Sudah Terajukan (ACC)</option></select></td>
                <td><button onclick="aksiRuang(${i}, 'tap')">Tap-In</button></td></tr>`;
            });
        }

        function renderAlat() {
            const tbody = document.getElementById('tabelAlat'); tbody.innerHTML = '';
            db.alat.forEach((a, i) => {
                tbody.innerHTML += `<tr><td>${a.id}</td><td>${a.nama}</td><td>${a.status}</td>
                <td><select onchange="db.alat[${i}].status=this.value; saveDB();"><option value="Belum Menyediakan" ${a.status=='Belum Menyediakan'?'selected':''}>Belum Menyediakan</option><option value="Dikembalikan" ${a.status=='Dikembalikan'?'selected':''}>Dikembalikan</option></select></td></tr>`;
            });
        }

        function renderKonstruksi() {
            const tbody = document.getElementById('tabelKonstruksi'); tbody.innerHTML = '';
            db.konstruksi.forEach((k, i) => {
                tbody.innerHTML += `<tr><td>${k.nama}</td><td>${k.ketersediaan}</td><td>${k.pembelian}</td></tr>`;
            });
        }

        function renderLog() {
            const tbody = document.getElementById('tabelLog'); tbody.innerHTML = '';
            db.log.slice(0, 30).forEach(l => {
                tbody.innerHTML += `<tr><td>${l.tanggal}</td><td>${l.waktu}</td><td>${l.user}</td><td>${l.tindakan}</td><td style="color:${l.warna}">${l.modul}</td></tr>`;
            });
        }

        function renderDropdownKategori() {
            const sel = document.getElementById('kategoriProyek');
            sel.innerHTML = '<option value="Semua Proyek">-- Semua Proyek --</option>';
            db.kategori.forEach(k => { sel.innerHTML += `<option value="${k}">${k}</option>`; });
        }

        function updateDashboard() {
            document.getElementById('dashRuang').innerText = db.ruang.length;
            document.getElementById('dashAlat').innerText = db.alat.length;
            document.getElementById('dashKonstruksi').innerText = db.konstruksi.length;
        }

        function catatLog(tindakan, modul, warna) {
            const d = new Date();
            db.log.unshift({ tanggal: d.toLocaleDateString(), waktu: d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}), user: localStorage.getItem('atpUser'), tindakan, modul, warna });
            saveDB();
        }

        function tambahRuang() { 
            let n = document.getElementById('inputRuang').value; 
            db.ruang.push({ nama: n, divisi: document.getElementById('divisiRuang').value, status: 'Belum Diajukan', tapped: false }); 
            catatLog('Tambah Ruang '+n, 'Ruang', getModulColor('Ruang')); saveDB(); 
        }

        function tambahAlat() { 
            let n = document.getElementById('inputAlat').value; 
            db.alat.push({ id: 'A-'+Date.now(), nama: n, asal: document.getElementById('asalAlat').value, status: 'Belum Menyediakan', jumlah: document.getElementById('jumlahAlat').value }); 
            catatLog('Tambah Alat '+n, 'Alat', getModulColor('Alat')); saveDB(); 
        }

        function tambahMaterial() { 
            let n = document.getElementById('inputMaterial').value; 
            db.konstruksi.push({ nama: n, ketersediaan: 'Belum Tersedia', pembelian: 'Belum Dibeli', proyek: document.getElementById('kategoriProyek').value }); 
            catatLog('Tambah Material '+n, 'Konstruksi', getModulColor('Konstruksi')); saveDB(); 
        }

        function masukSistem() { const n = document.getElementById('loginName').value; if(!n.trim()) return; localStorage.setItem('atpUser', n); location.reload(); }
        function keluarSistem() { localStorage.removeItem('atpUser'); location.reload(); }
        function toggleTheme() { document.body.classList.toggle('light-mode'); }
        function resetDatabase() { if(prompt("Ketik 'RESET'") === 'RESET') { db = { ruang: [], alat: [], konstruksi: [], log: [], kategori: ['Gate In', 'Gate Out'] }; saveDB(); location.reload(); } }
        function bukaTab(id, el) { 
            document.querySelectorAll('.tab-section').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active'); el.classList.add('active'); 
        }
        window.onload = function() {
            if(localStorage.getItem('atpUser')) { document.getElementById('loginModal').style.display = 'none'; document.getElementById('displayUserName').innerText = localStorage.getItem('atpUser'); }
            renderSemua(); renderDropdownKategori(); updateDashboard();
        };
    </script>
</body>
</html>
